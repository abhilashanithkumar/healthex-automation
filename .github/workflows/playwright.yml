name: Playwright checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run approved private read-only Chrome checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:typecheck
      - run: npm run test:list
      - run: npm run test:sharing:list

  approved-readonly:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: quality
    environment: healthex-tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      HEALTHEX_GOOGLE_EMAIL: ${{ secrets.HEALTHEX_GOOGLE_EMAIL }}
      HEALTHEX_PROVIDER: ${{ secrets.HEALTHEX_PROVIDER }}
      HEALTHEX_ACCOUNT_INITIALS: ${{ secrets.HEALTHEX_ACCOUNT_INITIALS }}
      HEALTHEX_AUTH_STATE: playwright/.auth/healthex.json
      HEALTHEX_AUTH_MODE: state
      HEALTHEX_FIXTURE_FILE: playwright/.auth/fixtures.json
      HEALTHEX_ALLOW_MUTATIONS: 'false'
      HEALTHEX_ALLOW_CONSENT: 'false'
      HEALTHEX_ALLOW_PROVIDER_GRANT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Prepare private approved fixtures
        env:
          AUTH_STATE_JSON: ${{ secrets.HEALTHEX_AUTH_STATE_JSON }}
          SESSION_STORAGE_JSON: ${{ secrets.HEALTHEX_SESSION_STORAGE_JSON }}
          FIXTURE_JSON: ${{ secrets.HEALTHEX_FIXTURE_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('playwright/.auth', { recursive: true, mode: 0o700 });
          for (const [name, key] of [['healthex.json', 'AUTH_STATE_JSON'], ['healthex.session.json', 'SESSION_STORAGE_JSON'], ['fixtures.json', 'FIXTURE_JSON']]) {
            if (!process.env[key]) throw new Error('Missing approved private CI fixture');
            JSON.parse(process.env[key]);
            fs.writeFileSync('playwright/.auth/' + name, process.env[key], { mode: 0o600 });
          }
          NODE
      - run: xvfb-run -a npm run test:readonly
      # Clinical downloads, snapshots and reports are deliberately not uploaded.
